<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SixF — Mockup Payno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- Página de apresentação ---------- */
:root{
  --page:#e8ecf1; --page-ink:#1d2433; --page-muted:#7b8494;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--page-ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;padding:40px 32px 80px}
.page-head{max-width:1500px;margin:0 auto 28px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.page-head h1{font-weight:400;font-size:28px;letter-spacing:-.4px}
.page-head p{color:var(--page-muted);font-size:14px;margin-top:6px}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.seg-ctl{display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:0 6px 20px rgba(30,45,80,.06)}
.seg-ctl button{border:0;background:transparent;font:500 13px Inter,sans-serif;color:var(--page-muted);
  padding:8px 16px;border-radius:999px;cursor:pointer}
.seg-ctl button.on{background:#3b5788;color:#fff}
section.group{max-width:1500px;margin:0 auto 56px}
section.group>h2{font-weight:500;font-size:15px;color:var(--page-muted);letter-spacing:.2px;margin-bottom:18px;display:flex;align-items:center;gap:10px}
section.group>h2::after{content:"";flex:1;height:1px;background:#d5dbe3}
.grid{display:grid;gap:28px}
.grid.phones{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.grid.desks{grid-template-columns:repeat(auto-fill,minmax(640px,1fr))}
.shot{display:flex;flex-direction:column;gap:12px}
.shot>label{font-size:13px;color:var(--page-muted);font-weight:500;padding-left:4px}
.fit{position:relative;width:100%}
.fit>.frame{position:absolute;top:0;left:0;transform-origin:0 0}
.hidden{display:none!important}

/* ---------- Tokens do tema (dentro de cada tela) ---------- */
.theme-light{
  --bg:#eef1f5; --blob1:rgba(61,90,140,.55); --blob2:rgba(120,145,190,.45);
  --card:rgba(255,255,255,.66); --card-solid:#fff; --stroke:rgba(255,255,255,.9);
  --ink:#1b2232; --muted:#8a93a3; --faint:#b7beca; --line:rgba(27,34,50,.07);
  --accent:#3b5788; --accent-ink:#fff; --accent-text:#3b5788; --accent-soft:rgba(59,87,136,.09);
  --key:rgba(244,246,250,.9); --hatch:#4a6698;
  --shadow:0 10px 30px rgba(30,45,80,.06), 0 1px 2px rgba(30,45,80,.04);
  --visual:linear-gradient(125deg,#f4f6f9 0%,#dfe5ee 32%,#9fb0cc 62%,#3d5a8c 100%);
  --visual-ink:#22345a; --visual-track:rgba(34,52,90,.14); --visual-fill:#3b5788; --ok:#2fa36b; --warn:#d9932b; --bad:#d94a4a;
}
.theme-dark{
  --bg:#0d121b; --blob1:rgba(70,105,170,.55); --blob2:rgba(50,75,125,.5);
  --card:rgba(28,36,51,.62); --card-solid:#1a2232; --stroke:rgba(255,255,255,.06);
  --ink:#e7ecf4; --muted:#8792a7; --faint:#5a6479; --line:rgba(255,255,255,.06);
  --accent:#4a6aa3; --accent-ink:#fff; --accent-text:#9db7e6; --accent-soft:rgba(125,160,220,.12);
  --key:rgba(255,255,255,.04); --hatch:#86a5dc;
  --shadow:0 12px 32px rgba(0,0,0,.35);
  --visual:linear-gradient(125deg,#1d2638 0%,#2b3c5c 40%,#4a6aa3 78%,#7e9ed6 100%);
  --visual-ink:#fff; --visual-track:rgba(255,255,255,.28); --visual-fill:#fff; --ok:#4cc38a; --warn:#e8a94a; --bad:#f06b6b;
}

/* ---------- Superfície das telas ---------- */
.frame{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;isolation:isolate}
.frame::before{content:"";position:absolute;z-index:-1;inset:-20% -10% auto -10%;height:70%;
  background:
    radial-gradient(40% 55% at 38% 35%, var(--blob1), transparent 70%),
    radial-gradient(30% 45% at 62% 20%, var(--blob2), transparent 70%),
    radial-gradient(25% 40% at 18% 10%, var(--blob2), transparent 70%);
  filter:blur(40px);opacity:.75}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:20px;box-shadow:var(--shadow);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:16px}
.card-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink);font-weight:500}
.card-h .ic{color:var(--muted)}
.card-h .muted{color:var(--muted);font-weight:400;font-size:11.5px}
.sp{flex:1}
.link{font-size:11px;color:var(--muted);font-weight:400}
.ic{flex:none;display:block}
.circ{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card-solid);
  border:1px solid var(--stroke);color:var(--ink);box-shadow:var(--shadow)}
.circ.lg{width:48px;height:48px}
.circ.sm{width:30px;height:30px}
.circ.xs{width:24px;height:24px}
.circ.navy{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.circ.soft{background:var(--key);box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:4px 9px;border-radius:999px;
  background:var(--key);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--accent);color:#fff;border-color:transparent}
.chip.acc{color:var(--accent-text);background:var(--accent-soft);border-color:transparent}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
.big{font-weight:300;letter-spacing:-1.2px;line-height:1}
.big small{font-size:.38em;color:var(--muted);letter-spacing:0;margin-left:4px;font-weight:400}
.label{font-size:10.5px;color:var(--muted)}
.hatch{height:12px;border-radius:999px;background:var(--key);border:1px solid var(--line);overflow:hidden;position:relative}
.hatch>i{position:absolute;inset:0 auto 0 0;border-radius:999px;
  background:repeating-linear-gradient(-45deg,var(--hatch) 0 1.6px,transparent 1.6px 4.5px);
  border-right:2px solid var(--hatch)}
.hatch.thin{height:8px}
.logo{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;
  font-weight:300;font-size:20px;box-shadow:0 6px 16px rgba(59,87,136,.35);letter-spacing:-1px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;padding:7px 12px;border-radius:999px;
  background:var(--card);border:1px solid var(--stroke);color:var(--muted);white-space:nowrap;box-shadow:var(--shadow)}
.pill.on{color:var(--ink);font-weight:500}
.pill.add{background:transparent;box-shadow:none;border:1px dashed var(--faint)}

/* Ações rápidas (padrão "Quick Actions") */
.qa-row{display:flex;justify-content:space-between;margin-top:14px}
.qa-i{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:10.5px;color:var(--ink)}
.qa-i .circ{color:var(--ink)}

/* Botões de lista (padrão "Upcoming Payments") */
.li{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:var(--key);border:1px solid var(--line)}
.li+.li{margin-top:8px}
.li .t{font-size:12px;font-weight:500}
.li .s{font-size:10px;color:var(--muted);margin-top:2px}
.li .r{margin-left:auto;text-align:right;font-size:12px;font-weight:500}
.li .r .s{text-align:right}
kbd{font:500 10.5px Inter,sans-serif;padding:3px 7px;border-radius:7px;background:var(--card-solid);border:1px solid var(--line);color:var(--ink)}

/* D-pad */
.wheel{position:relative;border-radius:50%;background:var(--card-solid);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.wheel::before{content:"";position:absolute;inset:9%;border-radius:50%;border:1px solid var(--line)}
.wheel .a{position:absolute;color:var(--ink);display:grid;place-items:center}
.wheel .a.u{top:5%;left:50%;transform:translateX(-50%)}
.wheel .a.d{bottom:5%;left:50%;transform:translateX(-50%)}
.wheel .a.l{left:5%;top:50%;transform:translateY(-50%)}
.wheel .a.r{right:5%;top:50%;transform:translateY(-50%)}
.wheel .ok{position:absolute;inset:0;margin:auto;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;
  font-weight:500;letter-spacing:.5px;box-shadow:0 10px 24px rgba(59,87,136,.4)}
.side-btn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:9.5px;color:var(--muted);letter-spacing:.4px}
.side-btn .sq{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;background:var(--card-solid);
  border:1px solid var(--stroke);box-shadow:var(--shadow);color:var(--ink)}

/* Rocker (VOL / CH) */
.rocker{display:flex;flex-direction:column;align-items:center;justify-content:space-between;border-radius:999px;
  background:var(--key);border:1px solid var(--line);padding:8px 0}
.rocker b{font-weight:500;font-size:10px;color:var(--muted);letter-spacing:.6px}

/* Teclado */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.key{height:50px;border-radius:16px;background:var(--key);border:1px solid var(--line);display:grid;place-items:center;
  font-size:19px;font-weight:300;color:var(--ink)}
.key.alt{color:var(--muted)}
.caret{display:inline-block;width:2px;height:.8em;background:var(--accent-text);margin-left:4px;vertical-align:-.05em}

/* Botões coloridos */
.color-btn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--key);
  border:1px solid var(--line);font-size:10.5px;font-weight:500;letter-spacing:.5px;color:var(--ink)}
.color-btn i{width:10px;height:10px;border-radius:50%}

/* Mídia */
.visual{border-radius:20px;background:var(--visual);color:var(--visual-ink);position:relative;overflow:hidden;
  box-shadow:0 16px 36px rgba(40,60,100,.18)}
.visual::after{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;right:-18%;bottom:-40%;
  border:28px solid rgba(255,255,255,.12)}
.visual .wm{position:absolute;font-weight:300;font-size:20px;letter-spacing:-.5px;color:rgba(255,255,255,.55)}
.theme-light .visual .wm{color:rgba(59,87,136,.28)}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{font-weight:400;color:var(--muted);text-align:left;padding:8px 10px;background:var(--key);font-size:10.5px}
.tbl th:first-child{border-radius:10px 0 0 10px}.tbl th:last-child{border-radius:0 10px 10px 0}
.tbl td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n{color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:10px}
.st.ok{color:var(--ok)} .st.warn{color:var(--warn)} .st.mute{color:var(--muted)}
.row-on td{background:var(--accent-soft)}
.row-on td:first-child{border-radius:10px 0 0 10px}.row-on td:last-child{border-radius:0 10px 10px 0}
.thumb{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);flex:none}

/* Apps */
.app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:16px;
  background:var(--key);border:1px solid var(--line);position:relative}
.app .ai{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:15px;
  box-shadow:0 6px 14px rgba(20,30,50,.14)}
.app span{font-size:10.5px;color:var(--ink);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.app .fav{position:absolute;top:8px;right:8px;color:var(--warn)}
.search{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--key);
  border:1px solid var(--line);font-size:11.5px;color:var(--muted)}

/* ---------- Celular ---------- */
.phone{width:390px;height:844px;border-radius:46px;position:relative;
  box-shadow:0 0 0 9px #14181f,0 0 0 10px #2a2f38,0 30px 60px rgba(20,30,50,.25)}
.phone .status{height:46px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0;font-size:13px;font-weight:600}
.phone .status .r{display:flex;gap:5px;align-items:center}
.phone .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#0a0c10}
.m-head{display:flex;align-items:center;gap:10px;padding:6px 18px 0}
.m-head .who{display:flex;flex-direction:column}
.m-head .who span{font-size:11px;color:var(--muted)}
.m-head .who b{font-weight:400;font-size:17px;letter-spacing:-.2px;margin-top:1px}
.m-pills{display:flex;gap:7px;padding:12px 18px 0;overflow:hidden}
.m-body{position:absolute;top:150px;left:0;right:0;bottom:96px;padding:6px 16px 0;display:flex;flex-direction:column;gap:12px}
.m-nav{position:absolute;left:16px;right:16px;bottom:22px;height:62px;border-radius:999px;background:var(--card);
  border:1px solid var(--stroke);box-shadow:0 12px 30px rgba(30,45,80,.12);backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.m-nav .t{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:var(--muted);width:58px}
.m-nav .t.on{color:var(--accent-text);font-weight:500}
.m-nav .t .ib{width:34px;height:28px;display:grid;place-items:center;border-radius:999px}
.m-nav .t.on .ib{background:var(--accent);color:#fff;width:46px}
.home-ind{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:4px;background:var(--ink);opacity:.25}

/* ---------- Desktop ---------- */
.desk{width:1240px;height:780px;border-radius:26px;position:relative;
  box-shadow:0 30px 70px rgba(20,30,50,.18), 0 0 0 1px rgba(20,30,50,.06)}
.d-top{position:absolute;top:0;left:0;right:0;height:78px;display:flex;align-items:center;padding:0 26px 0 22px;gap:12px}
.d-top .brand{font-weight:300;font-size:23px;letter-spacing:-.6px}
.d-top .brand em{font-style:normal;color:var(--muted);font-size:13px;letter-spacing:0;margin-left:6px}
.d-rail{position:absolute;top:78px;bottom:0;left:0;width:86px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:46px 0 26px}
.d-rail .circ{color:var(--muted)}
.d-rail .circ.navy{color:#fff}
.d-main{position:absolute;top:78px;left:86px;right:26px;bottom:24px;display:flex;flex-direction:column}
.d-title{height:48px;display:flex;align-items:center;gap:12px}
.d-title h3{font-weight:400;font-size:17px;letter-spacing:-.2px}
.btn-navy{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;font-size:11.5px;
  padding:9px 16px;border-radius:999px;box-shadow:0 8px 18px rgba(59,87,136,.3)}
.btn-ghost{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;padding:8px 14px;border-radius:999px;
  border:1px solid var(--line);color:var(--ink);background:var(--key)}
.d-grid{flex:1;display:grid;gap:16px;min-height:0}
.col{display:flex;flex-direction:column;gap:16px;min-height:0}
</style>
</head>
<body>

<div class="page-head">
  <div>
    <h1>SixF Remote — padrão Payno</h1>
    <p>Mockup das abas Controle, Teclas, Mídia e Apps · celular e desktop · tema claro e escuro</p>
  </div>
  <div class="filters">
    <div class="seg-ctl" data-filter="plat">
      <button class="on" data-v="all">Tudo</button><button data-v="phone">Celular</button><button data-v="desk">Desktop</button>
    </div>
    <div class="seg-ctl" data-filter="theme">
      <button class="on" data-v="all">Claro e escuro</button><button data-v="light">Claro</button><button data-v="dark">Escuro</button>
    </div>
  </div>
</div>

<div id="root"></div>

<script>
/* ---------- Ícones (traço 1.6, 24x24) ---------- */
const P = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',

  prev:'<path d="M19 20 9 12l10-8z"/><path d="M5 19V5"/>', next:'<path d="m5 4 10 8-10 8z"/><path d="M19 5v14"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  device:'<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/>',
  cloud:'<path d="M17.5 19H8a5 5 0 1 1 1-9.9A6 6 0 0 1 20.5 11 4 4 0 0 1 17.5 19z"/>',
  playlist:'<path d="M3 6h12M3 12h12M3 18h7"/><path d="M19 16V6l3 1"/><circle cx="17" cy="16" r="2"/>',
  queue:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  power:'<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',

        <div class="search" style="padding:7px 12px;width:200px">${ic('search',13)}Buscar nesta pasta</div>
        <span class="circ sm soft">${ic('list',14)}</span><span class="circ sm">${ic('thumbs',13)}</span></div>
      <table class="tbl" style="margin-top:14px"><thead><tr><th>#</th><th>Nome</th><th>Tipo</th><th>Tamanho</th><th>Duração</th><th>Status</th></tr></thead>

/* ---------- Montagem ---------- */
const ORDER=['controle','teclas','midia','apps'];
const NAMES={controle:'Controle',teclas:'Teclas',midia:'Mídia',apps:'Apps'};
const root=document.getElementById('root');
const groups=[['phone','light','Celular · tema claro',phone,390,844],['phone','dark','Celular · tema escuro',phone,390,844],
  ['desk','light','Desktop · tema claro',desk,1240,780],['desk','dark','Desktop · tema escuro',desk,1240,780]];
root.innerHTML=groups.map(([plat,theme,title,fn,w,h])=>`<section class="group" data-plat="${plat}" data-theme="${theme}"><h2>${title}</h2>
  <div class="grid ${plat==='phone'?'phones':'desks'}">${ORDER.map(t=>`<div class="shot"><label>${NAMES[t]}</label>
  <div class="fit" data-w="${w}" data-h="${h}" data-pad="${plat==='phone'?10:0}">${fn(t,theme)}</div></div>`).join('')}</div></section>`).join('');

function fit(){document.querySelectorAll('.fit').forEach(el=>{
  const w=+el.dataset.w,h=+el.dataset.h,p=+el.dataset.pad,avail=el.clientWidth-p*2;
  const s=Math.min(1,avail/w);const f=el.firstElementChild;
  f.style.transform=`translate(${p+(avail-w*s)/2}px,${p}px) scale(${s})`;el.style.height=(h*s+p*2)+'px';});}
addEventListener('resize',fit);fit();
document.fonts&&document.fonts.ready.then(fit);

const state={plat:'all',theme:'all'};
document.querySelectorAll('.seg-ctl').forEach(seg=>seg.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  state[seg.dataset.filter]=b.dataset.v;
  document.querySelectorAll('section.group').forEach(g=>g.classList.toggle('hidden',
    (state.plat!=='all'&&g.dataset.plat!==state.plat)||(state.theme!=='all'&&g.dataset.theme!==state.theme)));
  fit();
}));
</script>
